<title>Вечерний лагерь</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&family=Nunito:wght@700;800&display=swap">
<style>
  /* Сцена во весь экран; сверху слева — где мы, снизу — три кнопки на тёмном стекле */
  :root {
    --sky: #f3c9a2; --cream: #fff3e4; --ember: #ff9a4d; --muted: #e8d6c4;
    --glass: rgba(38, 26, 18, 0.58); --glass-off: rgba(112, 98, 88, 0.52);
    --display: "Comfortaa", "Nunito", system-ui, sans-serif; --body: "Nunito", system-ui, sans-serif;
  }
  html, body { height: 100%; overflow: hidden; }
  body { background: var(--sky); color: var(--cream); font-family: var(--body); }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #place { position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); left: calc(14px + env(safe-area-inset-left, 0px));
    display: grid; gap: 2px; padding: 8px 12px; border-radius: 12px; background: var(--glass); pointer-events: none; }
  #place b { font-family: var(--display); font-size: 16px; letter-spacing: 0.02em; }
  #place span { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  #ui { position: fixed; left: 0; right: 0; bottom: 0; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; pointer-events: none;
    padding: 0 max(16px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
  #ui button { pointer-events: auto; font: 800 15px var(--body); color: var(--cream); background: var(--glass);
    border: 0; border-radius: 12px; padding: 10px 16px; backdrop-filter: blur(4px); cursor: pointer; }
  #ui button[aria-pressed="false"] { background: var(--glass-off); color: var(--muted); text-decoration: line-through; }
  #ui button:focus-visible { outline: 3px solid var(--ember); outline-offset: 2px; }
  #load { position: fixed; inset: 0; display: grid; place-items: center; font: 700 18px var(--display); color: #6b3d1e; }
  body.ready #load { display: none; }
</style>
<div id="load">Разжигаем костёр…</div>
<div id="place"><b>Вечерний лагерь</b><span id="alt">уступ над морем</span></div>
<div id="ui">
  <button id="bFx" type="button" aria-pressed="true">Эффекты</button>
  <button id="bTex" type="button" aria-pressed="true">Текстуры</button>
  <button id="bView" type="button">Другой вид</button>
</div>
<!--GAME-->
