plugins {
    id 'com.android.application'
}

android {
    namespace "com.giver.game"
    compileSdk 34

    // постоянный ключ подписи: новая сборка ставится поверх старой, рекорды сохраняются
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    // Тестовая сборка «Giver Тест» (gradle ... -PgiverTest): своё имя, свой значок и свой applicationId —
    // ставится РЯДОМ с рабочей версией «Giver» и не трогает её сохранения.
    def giverTest = project.hasProperty('giverTest')

    defaultConfig {
        applicationId giverTest ? "com.giver.game.test" : "com.giver.game"
        minSdk 26
        targetSdk 34
        versionCode 12
        versionName "0.5-a5"
        manifestPlaceholders = [
            appLabel: giverTest ? "@string/app_name_test" : "@string/app_name",
            appIcon : giverTest ? "@mipmap/ic_launcher_test" : "@mipmap/ic_launcher"
        ]
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
