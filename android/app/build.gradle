plugins {
    id 'com.android.application'
}

android {
    namespace "com.giver.game"
    compileSdk 34

    // постоянный ключ подписи: новая сборка ставится поверх старой, рекорды сохраняются
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    defaultConfig {
        applicationId "com.giver.game"
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName "0.3"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
