name: Build APK

# main — рабочая версия «Giver» (релиз latest).
# Любая другая ветка (dev) — тестовая «Giver Тест» (релиз test): ставится рядом и рабочую не трогает.
on:
  workflow_dispatch:
  push:
    branches: [main, dev]
    # заметки и пробы не меняют игру — APK заново не собираем
    paths-ignore:
      - '**.md'
      - 'experiments/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Build game (src → android/app/src/main/assets/web)
        run: |
          npm ci
          npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            gradle -p android assembleDebug --no-daemon --stacktrace
            APK=Giver.apk; TAG=latest; TITLE="Giver APK"; PRE=""
          else
            gradle -p android assembleDebug -PgiverTest --no-daemon --stacktrace
            APK=GiverTest.apk; TAG=test; TITLE="Giver Тест APK"; PRE="--prerelease"
          fi
          cp android/app/build/outputs/apk/debug/app-debug.apk "$APK"
          ls -lh "$APK"
          { echo "APK=$APK"; echo "TAG=$TAG"; echo "TITLE=$TITLE"; echo "PRE=$PRE"; } >> "$GITHUB_ENV"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TAG }}-APK
          path: ${{ env.APK }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" "$APK" $PRE \
            --title "$TITLE" \
            --notes "Автоматическая сборка из ветки ${GITHUB_REF_NAME}, коммит ${GITHUB_SHA}" \
            --target "${GITHUB_SHA}"
