name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    # заметки и пробы не меняют игру — APK заново не собираем
    paths-ignore:
      - '**.md'
      - 'experiments/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Build game (src → android/app/src/main/assets/web)
        run: |
          npm ci
          npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          set -euo pipefail
          gradle -p android assembleDebug --no-daemon --stacktrace
          cp android/app/build/outputs/apk/debug/app-debug.apk Giver.apk
          ls -lh Giver.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Giver-APK
          path: Giver.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Giver.apk \
            --title "Giver APK" \
            --notes "Автоматическая сборка из коммита ${GITHUB_SHA}" \
            --target "${GITHUB_SHA}"
